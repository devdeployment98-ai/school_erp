services:
  - type: web
    name: school-erp
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run build && node server/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_DB_NAME
        value: campushub
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
